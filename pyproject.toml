[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clonetrace"
version = "0.1.0"
description = "Reproducible open-data clonal inference pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CloneTrace contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.scripts]
clonetrace = "clonetrace.cli:app"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.123,<7",
  "mypy>=1.14,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clonetrace"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true
